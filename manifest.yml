id: cidr_challenge

name: CIDR Challenge

short_description: IPv4 subnetting trainer for Flipper Zero

description: >
  CIDR Challenge is an offline IPv4 subnetting trainer for Flipper Zero.
  Practice network addresses, broadcast addresses, usable hosts and CIDR
  conversions through dynamic challenges.
  Includes training, speed, survival and exam modes with XP progression
  and local statistics.

