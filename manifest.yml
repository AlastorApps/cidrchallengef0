short_description: IPv4 subnetting trainer for Flipper Zero

description: |
  CIDR Challenge is an offline IPv4 subnetting trainer for Flipper Zero.

  Practice calculating network addresses, broadcast addresses, usable hosts,
  subnet masks and CIDR prefixes through dynamically generated exercises.

  Includes Training, Speed Challenge, Survival and Exam modes, along with
  XP progression and local statistics.

